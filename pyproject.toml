[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-auditor"
version = "0.1.0"
description = "Read-only static quality checks for local Python repositories"
requires-python = ">=3.10"
dependencies = ["ruff>=0.17.3"]

[project.scripts]
repo-auditor = "repo_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
